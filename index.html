<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crossdating-IDM</title>
  <style>
    .titlebar {
      height: 35px;
      /* background: #329ea3; */
      user-select: none;
      display: flex;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      font-size: 13px;
      /* color: rgb(66, 66, 66); */
    }

    .titlebar .titlebar-button {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 45px;
      height: 35px;
      user-select: none;
      -webkit-user-select: none;
    }

    .titlebar .titlebar-button img {
      width: 20px;
      height: 20px;
    }

    .titlebar .titlebar-button:hover {
      background: #e3e5e7;
    }

    .titlebar #titlebar-close:hover {
      background: rgb(213, 44, 28);
      color: white;
    }

    .titlebar .window-control {
      display: flex;
      justify-content: flex-end;
      /* 窗口控制按钮始终保持完整宽度，窗口变窄时不被挤出 */
      flex-shrink: 0;
    }

    .titlebar .menu {
      display: flex;
      align-items: center;
      padding-left: 10px;
      flex-shrink: 0;
      flex-wrap: nowrap;
    }

    .titlebar .menu .title-menu-item {
      border: none;
      box-shadow: none;
      cursor: unset;
      margin: 0.5em 0;
      padding: .1em 1em;
      border-radius: 4px;
      color: rgb(66, 66, 66);
      background-color: transparent;
      white-space: nowrap;
    }

    .titlebar .menu .title-menu-item:hover {
      background-color: #e8e8e8;
    }

    .titlebar .menu .title-menu-item-active {
      background-color: #e8e8e8;
    }

    .titlebar .drag-region {
      flex-grow: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .titlebar .address-container {
      display: flex;
      width: 60%;
      height: 24px;
      background-color: #292b343c;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      border-radius: 5px;
      padding: 0 10px;
      max-width: 540px;
      overflow: hidden;
      white-space: nowrap;
    }

    .titlebar .address-container .menu-title {
      width: 100%;
      text-overflow: ellipsis;
    }

    body {
      height: 100%;
      margin: 0;
    }

    .container {
      height: 100vh;
      /* 父容器占满整个视口高度 */
      min-height: 0;
      width: 100%;
      overflow: hidden;
    }
    
    #title-submenu-undo-button, #title-submenu-redo-button {
      cursor: pointer;
      transform: rotate(180deg);
    }
    #title-submenu-undo-button:hover, #title-submenu-redo-button:hover {
      background-color: #e3e5e7;
    }
    #title-submenu-undo-button:active, #title-submenu-redo-button:active {
      color: rgb(255, 255, 255);
    }
    #title-submenu-undo-button:disabled, #title-submenu-redo-button:disabled {
      cursor: default;
      opacity: 0.35;
      color: inherit;
    }
    #title-submenu-undo-button:disabled:hover, #title-submenu-redo-button:disabled:hover {
      background-color: transparent;
    }

    .titlebar .titlebar-legend {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 14px;
      font-family: "Segoe UI", system-ui, sans-serif;
      font-size: 12px;
      color: #5a6675;
      user-select: none;
      -webkit-user-select: none;
      /* 容器自身接收指针事件以充当 data-tauri-drag-region 拖拽区 */
      pointer-events: auto;
      cursor: default;
      /* 空间不足时图例先收缩让位，避免挤压窗口控制按钮 */
      flex-shrink: 1;
      min-width: 0;
      overflow: hidden;
    }

    /* 图例内部元素不拦截事件，让点击落到容器上触发窗口拖拽 */
    .titlebar .titlebar-legend * {
      pointer-events: none;
    }

    .titlebar .titlebar-logo {
      align-items: center;
      padding: 0 6px 0 12px;
      user-select: none;
      -webkit-user-select: none;
    }

    .titlebar .titlebar-logo img {
      width: 22px;
      height: 22px;
      -webkit-user-drag: none;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="titlebar">
      <!-- Logo（默认隐藏，工作区独立窗口由 main.tsx 显示在左上角） -->
      <div class="titlebar-logo" id="titlebar-logo" data-tauri-drag-region style="display: none;">
        <img src="/src-tauri/icons/icon.png" alt="logo" data-tauri-drag-region />
      </div>

      <!-- Menu Section -->
      <div class="menu">
        <div class="title-menu-item-container">
          <button class="title-menu-item" id="title-submenu-file-button">文件(F)</button>
          <div class="title-submenu-container" id="title-submenu-file-container"></div> <!-- 这里是 React 组件Menu的挂载点 -->
        </div>
        <div class="title-menu-item-container">
          <button class="title-menu-item" id="title-submenu-edit-button">编辑(E)</button>
          <div class="title-submenu-container" id="title-submenu-edit-container"></div> <!-- 这里是 React 组件Menu的挂载点 -->
        </div>
        <div class="title-menu-item-container">
          <button class="title-menu-item" id="title-submenu-run-button">运行(R)</button>
          <div class="title-submenu-container" id="title-submenu-run-container"></div> <!-- 这里是 React 组件Menu的挂载点 -->
        </div>
        <button class="title-menu-item" id="title-submenu-undo-button" title="撤销">↪</button>
        <button class="title-menu-item" id="title-submenu-redo-button" title="恢复">↩</button>

      </div>

      <!-- Drag Region -->
      <div data-tauri-drag-region class="drag-region">
        <div data-tauri-drag-region class="address-container">
          <span data-tauri-drag-region class="menu-title" id="menu-title"></span>
        </div>
      </div>

      <!-- Width Legend（React 通过 createPortal 挂载窄年/伪轮/缺轮/缺测图例） -->
      <div class="titlebar-legend" id="titlebar-legend-container" data-tauri-drag-region></div>

      <!-- Window Control Buttons -->
      <div class="window-control">
        <div class="titlebar-button" id="titlebar-minimize">
          <img src="/mdi_window-minimize.svg" alt="minimize" />
        </div>
        <div class="titlebar-button" id="titlebar-maximize">
          <img src="/mdi_window-maximize.svg" alt="maximize" />
        </div>
        <div class="titlebar-button" id="titlebar-close">
          <img src="/mdi_close.svg" alt="close" />
        </div>
      </div>
    </div>
    <div id="root"></div>
  </div>
  <script type="module">
    import { getCurrentWindow } from '@tauri-apps/api/window';

    // when using `"withGlobalTauri": true`, you may use
    // const { getCurrentWindow } = window.__TAURI__.window;

    const appWindow = getCurrentWindow();

    document
      .getElementById('titlebar-minimize')
      ?.addEventListener('click', () => appWindow.minimize());
    document
      .getElementById('titlebar-maximize')
      ?.addEventListener('click', () => appWindow.toggleMaximize());
    document
      .getElementById('titlebar-close')
      ?.addEventListener('click', () => appWindow.close());
  </script>
  <script type="module" src="/src/app/main.tsx"></script>
</body>

</html>
