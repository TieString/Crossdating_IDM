<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">Integrated workflow of Crossdating-IDM</title>
  <desc id="desc">An integrated workflow from RWL import through chronology editing, COFECHA execution, reference construction, diagnostic candidates, audit logging, and visual interfaces.</desc>
  <defs>
    <style>
      .bg{fill:#fbfbf8}.title{font:700 36px Arial,Segoe UI,sans-serif;fill:#18202a}.sub{font:18px Arial,Segoe UI,sans-serif;fill:#596574}
      .h{font:700 24px Arial,Segoe UI,sans-serif;fill:#18202a}.t{font:15px Arial,Segoe UI,sans-serif;fill:#596574}.note{font:15px Arial,Segoe UI,sans-serif;fill:#596574}
      .box{fill:#fff;stroke:#b9c2cf;stroke-width:2}.arrow{stroke:#46505c;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#46505c"/>
    </marker>
  </defs>
  <rect class="bg" width="1800" height="1120"/>
  <text x="70" y="78" class="title">Integrated workflow of Crossdating-IDM</text>
  <text x="70" y="112" class="sub">Traceable RWL editing, COFECHA-assisted diagnosis, and user-confirmed chronology revision</text>

  <g transform="translate(80 170)">
    <rect class="box" width="350" height="150" rx="8"/><rect width="8" height="150" rx="8" fill="#2f6fed"/>
    <text x="18" y="42" class="h">RWL input</text>
    <text x="18" y="73" class="t">Tucson, Heidelberg/FH, compact DPLR,</text><text x="18" y="94" class="t">CSV, and TRiDaS parsers return</text><text x="18" y="115" class="t">Map(series -&gt; year -&gt; width).</text>
  </g>
  <g transform="translate(520 170)">
    <rect class="box" width="350" height="150" rx="8"/><rect width="8" height="150" rx="8" fill="#13858c"/>
    <text x="18" y="42" class="h">Chronology editor</text>
    <text x="18" y="73" class="t">Maintains a raw baseline, editable working</text><text x="18" y="94" class="t">chronology, undo/redo history, deletion</text><text x="18" y="115" class="t">records, and operation log.</text>
  </g>
  <g transform="translate(960 170)">
    <rect class="box" width="350" height="150" rx="8"/><rect width="8" height="150" rx="8" fill="#c76f2b"/>
    <text x="18" y="42" class="h">COFECHA execution</text>
    <text x="18" y="73" class="t">Runs the selected external COFECHA</text><text x="18" y="94" class="t">program, reads VERYCOF.OUT, and</text><text x="18" y="115" class="t">keeps output linked to the source file.</text>
  </g>
  <g transform="translate(1400 170)">
    <rect class="box" width="350" height="150" rx="8"/><rect width="8" height="150" rx="8" fill="#2f8b57"/>
    <text x="18" y="42" class="h">Report interpretation</text>
    <text x="18" y="73" class="t">Converts COFECHA summaries, master</text><text x="18" y="94" class="t">series, problem segments, and correlations</text><text x="18" y="115" class="t">into navigable workspace evidence.</text>
  </g>

  <g transform="translate(80 480)">
    <rect class="box" width="350" height="170" rx="8"/><rect width="8" height="170" rx="8" fill="#2f8b57"/>
    <text x="18" y="42" class="h">Reference builder</text>
    <text x="18" y="73" class="t">Provides manual reference selection and</text><text x="18" y="94" class="t">COFECHA-derived dynamic references for</text><text x="18" y="115" class="t">charting and diagnostic comparison.</text>
  </g>
  <g transform="translate(520 480)">
    <rect class="box" width="350" height="170" rx="8"/><rect width="8" height="170" rx="8" fill="#7b4cc2"/>
    <text x="18" y="42" class="h">Diagnostic screening</text>
    <text x="18" y="73" class="t">Runs segment-level lag scans and</text><text x="18" y="94" class="t">candidate generation using the current</text><text x="18" y="115" class="t">working chronology and report evidence.</text>
  </g>
  <g transform="translate(960 480)">
    <rect class="box" width="350" height="170" rx="8"/><rect width="8" height="170" rx="8" fill="#c94040"/>
    <text x="18" y="42" class="h">Candidate evaluation</text>
    <text x="18" y="73" class="t">Counterfactual apply, re-diagnose, hard</text><text x="18" y="94" class="t">gates, confidence ranking, and executable</text><text x="18" y="115" class="t">edit constraints.</text>
  </g>
  <g transform="translate(1400 480)">
    <rect class="box" width="350" height="170" rx="8"/><rect width="8" height="170" rx="8" fill="#2f6fed"/>
    <text x="18" y="42" class="h">Confirmed correction</text>
    <text x="18" y="73" class="t">Applies one accepted suggestion, records</text><text x="18" y="94" class="t">the revision, and recomputes diagnostics</text><text x="18" y="115" class="t">from the updated chronology.</text>
  </g>

  <g transform="translate(520 800)">
    <rect class="box" width="350" height="170" rx="8"/><rect width="8" height="170" rx="8" fill="#13858c"/>
    <text x="18" y="42" class="h">Revision memory</text>
    <text x="18" y="73" class="t">Restores recent editor history, COFECHA</text><text x="18" y="94" class="t">state, reference settings, and window</text><text x="18" y="115" class="t">context for the active chronology.</text>
  </g>
  <g transform="translate(960 800)">
    <rect class="box" width="350" height="170" rx="8"/><rect width="8" height="170" rx="8" fill="#c76f2b"/>
    <text x="18" y="42" class="h">UI surfaces</text>
    <text x="18" y="73" class="t">Main grid, line chart, operation log</text><text x="18" y="94" class="t">window, COFECHA report window, and</text><text x="18" y="115" class="t">expanded chart window.</text>
  </g>

  <path class="arrow" d="M430 245 H520"/><path class="arrow" d="M870 245 H960"/><path class="arrow" d="M1310 245 H1400"/>
  <path class="arrow" d="M1575 320 V480"/><path class="arrow" d="M1400 565 H1310"/><path class="arrow" d="M960 565 H870"/><path class="arrow" d="M520 565 H430"/>
  <path class="arrow" d="M255 480 V320"/><path class="arrow" d="M695 650 V800"/><path class="arrow" d="M1135 650 V800"/><path class="arrow" d="M870 885 H960"/>
  <path d="M245 650 C245 1040 1575 1040 1575 650" stroke="#8792a0" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="520" y="1038" class="note">Reference series are derived diagnostic objects; confirmed corrections are written through explicit chronology-editing operations.</text>
</svg>
