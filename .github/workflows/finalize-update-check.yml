name: Finalize update check feature

on:
  push:
    branches: [feat/github-release-update-check]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/github-release-update-check
          fetch-depth: 0
      - name: Apply tested update-check patches
        run: |
          git apply --check .github/update-check-patches/settings.patch
          git apply --check .github/update-check-patches/settings-css.patch
          git apply --check .github/update-check-patches/en.patch
          git apply .github/update-check-patches/settings.patch
          git apply .github/update-check-patches/settings-css.patch
          git apply .github/update-check-patches/en.patch
          rm -rf .github/update-check-patches
          rm .github/workflows/finalize-update-check.yml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run test:production
      - run: npm run test:i18n
      - name: Commit validated update-check feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add GitHub release update checks"
          git push origin HEAD:feat/github-release-update-check
