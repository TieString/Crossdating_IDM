name: Import tested localization source

on:
  push:
    branches: [feat/english-language-switch]
    paths:
      - '.i18n-import/**'
      - '.github/workflows/i18n-import.yml'

permissions:
  contents: write

concurrency:
  group: import-crossdating-localization
  cancel-in-progress: false

jobs:
  import:
    if: github.ref == 'refs/heads/feat/english-language-switch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify and expand exact tested source
        shell: python
        run: |
          import base64, hashlib, json, lzma
          from pathlib import Path
          parts = sorted(Path('.i18n-import').glob('part-*.txt'))
          assert len(parts) == 8
          raw = lzma.decompress(base64.b64decode(''.join(p.read_text() for p in parts), validate=True))
          assert hashlib.sha256(raw).hexdigest() == '2684e6f602115cb0f6eebe779792d8556e6abf964b3b0282739f69e9a3b55be2'
          manifest = json.loads(raw)
          assert len(manifest) == 48
          pending = {}
          for item in manifest:
              path = Path(item['path'])
              assert not path.is_absolute() and '..' not in path.parts
              assert item['path'] in {'AGENTS.md', 'README.md', 'package.json', 'docs/i18n.md'} or item['path'].startswith('src/')
              assert path not in pending and not path.is_symlink()
              original = path.read_bytes() if path.exists() else b''
              assert hashlib.sha256(original).hexdigest() == item['before'], str(path)
              lines = original.decode('utf-8').splitlines(keepends=True)
              for start, end, text in reversed(item['edits']):
                  assert 0 <= start <= end <= len(lines)
                  lines[start:end] = [text]
              result = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(result).hexdigest() == item['after'], str(path)
              pending[path] = result
          for path, content in pending.items():
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(content)
          print('Verified and expanded all 48 source/documentation files.')
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run test:production
      - run: npm run test:i18n
      - name: Commit validated source to the feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src docs/i18n.md AGENTS.md README.md package.json
          git diff --cached --check
          git commit -m 'feat: add offline Chinese/English UI localization with live cross-window switching'
          git push origin HEAD:refs/heads/feat/english-language-switch
