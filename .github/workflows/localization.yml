name: Localization checks

on:
  pull_request:
    branches: [main, feat/english-language-switch]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: localization-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run test:production
      - run: npm run test:i18n
