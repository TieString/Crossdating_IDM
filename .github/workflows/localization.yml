name: Localization checks

on:
  push:
    branches: [feat/english-language-switch, feat/github-release-update-check]
  pull_request:
    branches: [main, feat/english-language-switch]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run test:production
      - run: npm run test:i18n
