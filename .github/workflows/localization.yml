name: Localization checks

on:
  push:
    branches: [feat/english-language-switch]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Archive reproducible test environment
        run: tar -czf localization-test-environment.tar.gz node_modules package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: localization-test-environment
          path: localization-test-environment.tar.gz
          retention-days: 1
      - run: npm run build
      - run: npm run test:production
